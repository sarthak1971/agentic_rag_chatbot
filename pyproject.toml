[project]
name = "ytrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.16.0",
    "grok>=6.2",
    "ipykernel>=7.4.0",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langsmith>=0.14.17",
    "pymupdf>=2.1",
    "pypdf>=7.0.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.52.0",
    "typesense>=2.1.1",
]

[project.scripts]
ytrag = "ytrag:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
